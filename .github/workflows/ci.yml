name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-test.yml
    with:
      build-type: Release
      test-labels: "unit|integration"

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed C++ files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              changed_files=$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                changed_files=$(git ls-tree -r --name-only "$PUSH_AFTER_SHA")
              elif git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
                changed_files=$(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")
              else
                changed_files=$(jq -r '.[] | (.added[]?, .modified[]?, .removed[]?)' <<< "$PUSH_COMMITS")
              fi
              ;;
            workflow_dispatch)
              changed_files=$(git ls-files)
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          cpp_files=$(grep -E '\.(cc|cpp|cxx|h|hh|hpp|hxx)$' <<< "$changed_files" || true)
          files_json=$(printf '%s\n' "$cpp_files" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "cpp_files=$files_json" >> "$GITHUB_OUTPUT"
          if [[ $(jq 'length' <<< "$files_json") -gt 0 ]]; then
            echo 'cpp=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cpp=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build and lint dependencies
        if: steps.changed-files.outputs.cpp == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            clang-tidy \
            cmake \
            libgtest-dev \
            libopencv-dev \
            libtiff-dev \
            ninja-build \
            nlohmann-json3-dev \
            qt6-base-dev

      - name: Configure with clang-tidy
        if: steps.changed-files.outputs.cpp == 'true'
        run: cmake --preset linux-clang-tidy -DENABLE_CLANG_TIDY=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on changed C++ files
        if: steps.changed-files.outputs.cpp == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.cpp_files }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(jq -r '.[]' <<< "$CHANGED_FILES")

          status=0
          for file in "${changed_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            echo "::group::clang-tidy $file"
            if ! clang-tidy -p build/linux-clang-tidy \
              --warnings-as-errors='*' --header-filter='^$' "$file"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
