name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group : ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-test.yml
    with:
      build-type: Release
      test-labels: "unit|integration"

  build-and-test-windows:
    uses: ./.github/workflows/build-test-windows.yml

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed C++ files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              changed_files=$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            push)
              # Comme pour une pull request : seulement ce que la branche change par rapport à main,
              # pour qu'une fusion de main dans la branche ne fasse pas analyser tout le code de main.
              git fetch --no-tags origin main:refs/remotes/origin/main
              changed_files=$(git diff --name-only "origin/main...$PUSH_AFTER_SHA")
              ;;
            workflow_dispatch)
              changed_files=$(git ls-files)
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          cpp_files=$(grep -E '\.(cc|cpp|cxx|h|hh|hpp|hxx)$' <<< "$changed_files" || true)
          files_json=$(printf '%s\n' "$cpp_files" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "cpp_files=$files_json" >> "$GITHUB_OUTPUT"
          if [[ $(jq 'length' <<< "$files_json") -gt 0 ]]; then
            echo 'cpp=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cpp=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build and lint dependencies
        if: steps.changed-files.outputs.cpp == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            clang-tidy \
            cmake \
            libgtest-dev \
            libopencv-dev \
            libtiff-dev \
            ninja-build \
            nlohmann-json3-dev \
            qt6-base-dev

      - name: Restore LightGlue model
        if: steps.changed-files.outputs.cpp == 'true'
        uses: actions/cache@v4
        with:
          path: build/linux-clang-tidy/models
          key: lightglue-model-${{ hashFiles('tests/steps/CMakeLists.txt') }}

      - name: Configure with clang-tidy
        if: steps.changed-files.outputs.cpp == 'true'
        run: cmake --preset linux-clang-tidy -DENABLE_CLANG_TIDY=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on changed C++ files
        if: steps.changed-files.outputs.cpp == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.cpp_files }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(jq -r '.[]' <<< "$CHANGED_FILES")

          status=0
          for file in "${changed_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            echo "::group::clang-tidy $file"
            output=$(clang-tidy -p build/linux-clang-tidy --warnings-as-errors='*' --header-filter='^$' "$file" 2>&1 || true)
            echo "$output"
            if grep -qE "error:|warning:" <<< "$output"; then
              status=1
              while IFS= read -r line; do
                echo "::error file=$file,title=ClangTidy::$line"
              done < <(grep -E 'error:|warning:' <<< "$output" | head -n 30)
            fi
            echo "::endgroup::"
          done
          exit "$status"
